<!doctype html>
<html>
<head>
    <title>Fitness Onboarding</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
        label { display: block; margin: 10px 0 4px; }
        input, select { width: 100%; padding: 8px; }
        button { margin-top: 20px; padding: 10px; width: 100%; background: #2563eb; color: white; border: none; border-radius: 4px; }
        .note { font-size: 0.8rem; color: #666; margin: 10px 0; }
    </style>
</head>
<body>
<h1>Start Your Fitness Journey</h1>
<form method="POST">
    <label>Email: <input type="email" name="email" required></label>
    <label>Age: <input type="number" name="age" required></label>
    <label>Height (cm): <input type="number" name="height" required></label>
    <label>Weight (kg): <input type="number" name="weight" step="0.1" required></label>
    <label>Experience:
        <select name="experience">
            <option value="beginner">Beginner (< 6 months)</option>
            <option value="intermediate">Intermediate (6m – 2y)</option>
            <option value="advanced">Advanced (2y+)</option>
        </select>
    </label>
    <label>Days per week:
        <select name="frequency">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
        </select>
    </label>
    <label>Limitations (e.g., back pain): <input type="text" name="limitations_desc"></label>
    <button type="submit">Generate My Program</button>
    <p class="note">🔒 Your email is hashed and stored securely. No raw PII is saved.</p>
</form>
</body>
</html>
